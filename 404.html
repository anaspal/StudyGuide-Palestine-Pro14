<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyGuide Palestine</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Send the visitor back to the app root
      // (project page: /<repo>/, custom domain or user page: /) so relative assets resolve correctly.
      (function () {
        var seg = location.pathname.split("/")[1];
        var base = location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/";
        location.replace(base + location.hash);
      })();
    </script>
  </head>
  <body><p style="font:600 18px sans-serif;text-align:center;padding:40px">جارٍ التحويل إلى الصفحة الرئيسية… <a href="./">اضغط هنا</a></p></body>
</html>
